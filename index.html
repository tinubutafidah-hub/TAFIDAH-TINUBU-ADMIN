<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — T/T Tinubu Tafidah</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: #0a1f0a;
      min-height: 100vh;
      color: #fff;
    }

    /* LOGIN */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #0a1f0a 0%, #006B3F 50%, #0a1f0a 100%);
    }
    .login-card {
      background: #fff;
      color: #0b1f0b;
      padding: 34px 28px;
      border-radius: 24px;
      max-width: 400px;
      width: 100%;
      border: 3px solid #006B3F;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .login-card h1 {
      color: #006B3F;
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 6px;
    }
    .login-card p {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 22px;
    }
    .login-card input {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid #ccd8e8;
      border-radius: 12px;
      font-size: 0.95rem;
      margin-bottom: 12px;
      background: #f9fbfd;
      color: #0b1f0b;
    }
    .login-card input:focus { border-color: #006B3F; outline: none; }
    .login-card button {
      width: 100%;
      padding: 14px;
      background: #006B3F;
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .login-card button:disabled { background: #999; }
    .login-err {
      background: #ffebee;
      color: #b71c1c;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 12px;
      display: none;
    }
    .login-err.show { display: block; }

    /* DASHBOARD */
    #dashboard { display: none; }
    #dashboard.show { display: block; }

    .admin-header {
      background: #006B3F;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #ffeb3b;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 10px;
    }
    .admin-header h1 {
      font-size: 1rem;
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .admin-header h1 span {
      background: #ffeb3b;
      color: #006B3F;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 0.7rem;
    }
    .admin-header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .scan-qr-btn, .logout-btn {
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.8rem;
      border: none;
    }
    .scan-qr-btn { background: #fff; color: #006B3F; border: 2px solid #006B3F; }
    .logout-btn { background: #d32f2f; color: #fff; }

    .admin-body { padding: 20px; max-width: 1200px; margin: 0 auto; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #fff;
      color: #0b1f0b;
      padding: 16px;
      border-radius: 14px;
      border-left: 5px solid #006B3F;
    }
    .stat-label { font-size: 0.75rem; font-weight: 700; color: #666; }
    .stat-value { font-size: 1.7rem; font-weight: 900; color: #006B3F; }

    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .search-bar input, .search-bar select {
      padding: 11px 14px;
      border: 2px solid #006B3F;
      border-radius: 12px;
      font-size: 0.9rem;
      background: #fff;
      color: #0b1f0b;
      flex: 1;
      min-width: 140px;
    }
    .search-bar button {
      padding: 11px 20px;
      background: #ffeb3b;
      color: #006B3F;
      border: none;
      border-radius: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .members-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .member-item {
      background: #fff;
      color: #0b1f0b;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      gap: 12px;
      border: 2px solid #006B3F;
    }
    .member-item img {
      width: 70px; height: 85px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #006B3F;
      flex-shrink: 0;
    }
    .member-info { flex: 1; font-size: 0.82rem; min-width: 0; }
    .member-info h3 {
      font-size: 0.9rem;
      color: #006B3F;
      text-transform: uppercase;
      margin-bottom: 3px;
      word-break: break-word;
    }
    .member-info .mem-num {
      font-family: monospace;
      font-size: 0.75rem;
      font-weight: 900;
      background: #eaf5ea;
      padding: 2px 6px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 5px;
    }
    .member-info div { margin-bottom: 2px; color: #333; word-break: break-word; }
    .member-info strong { color: #006B3F; }
    .member-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .member-actions button {
      padding: 5px 12px;
      border-radius: 14px;
      border: none;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-view { background: #e3f2fd; color: #1565c0; }
    .btn-share { background: #fff8e1; color: #f57c00; }
    .btn-del { background: #ffebee; color: #c62828; }

    .empty-msg {
      text-align: center;
      padding: 40px 20px;
      color: #aaa;
      font-size: 0.95rem;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: #fff;
      color: #0b1f0b;
      border-radius: 18px;
      padding: 18px;
      max-width: 380px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-content img {
      width: 100%;
      border-radius: 10px;
      border: 3px solid #006B3F;
      margin-bottom: 12px;
    }
    .modal-content h3 { color: #006B3F; margin-bottom: 8px; }
    .modal-content p { font-size: 0.9rem; margin-bottom: 5px; }
    .modal-content .close-modal {
      width: 100%;
      padding: 12px;
      background: #006B3F;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginPage" class="login-wrap">
    <div class="login-card">
      <h1>🔐 Admin Login</h1>
      <p>T/T Tinubu Tafidah — Members Management</p>
      <div id="loginErr" class="login-err"></div>
      <input type="email" id="adminEmail" placeholder="Admin Email">
      <input type="password" id="adminPassword" placeholder="Password">
      <button id="btnLogin">Login</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <div class="admin-header">
      <h1>T/T Tinubu Tafidah <span>ADMIN</span></h1>
      <div class="admin-header-actions">
        <button class="scan-qr-btn" id="btnScanQR">📷 Scan QR</button>
        <button class="logout-btn" id="btnLogout">Logout</button>
      </div>
    </div>

    <div class="admin-body">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">TOTAL MEMBERS</div>
          <div class="stat-value" id="statTotal">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">TODAY</div>
          <div class="stat-value" id="statToday">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">STATES</div>
          <div class="stat-value" id="statStates">0</div>
        </div>
      </div>

      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 Search name, phone, or membership number...">
        <select id="stateFilter">
          <option value="">All States</option>
          <option value="Abia">Abia</option>
          <option value="Adamawa">Adamawa</option>
          <option value="Akwa Ibom">Akwa Ibom</option>
          <option value="Anambra">Anambra</option>
          <option value="Bauchi">Bauchi</option>
          <option value="Bayelsa">Bayelsa</option>
          <option value="Benue">Benue</option>
          <option value="Borno">Borno</option>
          <option value="Cross River">Cross River</option>
          <option value="Delta">Delta</option>
          <option value="Ebonyi">Ebonyi</option>
          <option value="Edo">Edo</option>
          <option value="Ekiti">Ekiti</option>
          <option value="Enugu">Enugu</option>
          <option value="FCT Abuja">FCT Abuja</option>
          <option value="Gombe">Gombe</option>
          <option value="Imo">Imo</option>
          <option value="Jigawa">Jigawa</option>
          <option value="Kaduna">Kaduna</option>
          <option value="Kano">Kano</option>
          <option value="Katsina">Katsina</option>
          <option value="Kebbi">Kebbi</option>
          <option value="Kogi">Kogi</option>
          <option value="Kwara">Kwara</option>
          <option value="Lagos">Lagos</option>
          <option value="Nasarawa">Nasarawa</option>
          <option value="Niger">Niger</option>
          <option value="Ogun">Ogun</option>
          <option value="Ondo">Ondo</option>
          <option value="Osun">Osun</option>
          <option value="Oyo">Oyo</option>
          <option value="Plateau">Plateau</option>
          <option value="Rivers">Rivers</option>
          <option value="Sokoto">Sokoto</option>
          <option value="Taraba">Taraba</option>
          <option value="Yobe">Yobe</option>
          <option value="Zamfara">Zamfara</option>
        </select>
        <button id="btnRefresh">🔄 Refresh</button>
      </div>

      <div id="membersGrid" class="members-grid"></div>
      <div id="emptyMsg" class="empty-msg" style="display:none;">
        No members have registered yet.
      </div>
    </div>
  </div>

  <div id="viewModal" class="modal">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <div id="qrScannerModal" class="modal">
    <div class="modal-content" style="max-width: 420px;">
      <h3 style="text-align:center; margin-bottom:12px;">📷 Scan Member QR Code</h3>
      <div id="qr-reader" style="width:100%; border-radius:12px; overflow:hidden;"></div>
      <div id="qr-result" style="margin-top:12px; font-size:0.9rem; text-align:center;"></div>
      <button class="close-modal" id="closeQrScanner">Close Scanner</button>
    </div>
  </div>

  <!-- ================= FIREBASE ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { 
      getFirestore, collection, getDocs, deleteDoc, doc, query, orderBy 
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { 
      getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB4LCucIjergf_19n736U9UXRppE540JPE",
      authDomain: "tinubu-tafidah-7faa4.firebaseapp.com",
      databaseURL: "https://tinubu-tafidah-7faa4-default-rtdb.firebaseio.com",
      projectId: "tinubu-tafidah-7faa4",
      storageBucket: "tinubu-tafidah-7faa4.firebasestorage.app",
      messagingSenderId: "850414816844",
      appId: "1:850414816844:web:781e933aabe7bbdfb32ee9",
      measurementId: "G-XTX242X07L"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const loginPage = document.getElementById('loginPage');
    const dashboard = document.getElementById('dashboard');
    const loginErr = document.getElementById('loginErr');
    const adminEmail = document.getElementById('adminEmail');
    const adminPassword = document.getElementById('adminPassword');
    const btnLogin = document.getElementById('btnLogin');
    const btnLogout = document.getElementById('btnLogout');
    const btnRefresh = document.getElementById('btnRefresh');
    const membersGrid = document.getElementById('membersGrid');
    const emptyMsg = document.getElementById('emptyMsg');
    const searchInput = document.getElementById('searchInput');
    const stateFilter = document.getElementById('stateFilter');
    const viewModal = document.getElementById('viewModal');
    const modalContent = document.getElementById('modalContent');

    let allMembers = [];

    function showLoginError(msg) {
      loginErr.textContent = msg;
      loginErr.classList.add('show');
      setTimeout(() => loginErr.classList.remove('show'), 5000);
    }
    function showLoginPage() {
      loginPage.style.display = 'flex';
      dashboard.classList.remove('show');
    }
    function showDashboard() {
      loginPage.style.display = 'none';
      dashboard.classList.add('show');
      loadMembers();
    }
    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    function formatDate(ts) {
      if (!ts) return '';
      let d;
      if (ts.toDate) d = ts.toDate();
      else if (ts.seconds) d = new Date(ts.seconds * 1000);
      else d = new Date(ts);
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    btnLogin.addEventListener('click', async () => {
      const email = adminEmail.value.trim();
      const password = adminPassword.value;

      if (!email || !password) {
        showLoginError('⚠️ Fill in email and password.');
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = '⏳ Please wait...';

      try {
        await signInWithEmailAndPassword(auth, email, password);
        loginErr.classList.remove('show');
        adminEmail.value = '';
        adminPassword.value = '';
        showDashboard();
      } catch (err) {
        console.error('Login error:', err);
        let msg = '❌ ' + err.message;
        if (err.code === 'auth/invalid-credential') msg = '❌ Email or password incorrect.';
        if (err.code === 'auth/user-not-found') msg = '❌ No such admin found.';
        if (err.code === 'auth/wrong-password') msg = '❌ Password incorrect.';
        if (err.code === 'auth/invalid-api-key') msg = '❌ Firebase API key invalid.';
        showLoginError(msg);
      }

      btnLogin.disabled = false;
      btnLogin.textContent = 'Login';
    });

    adminPassword.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') btnLogin.click();
    });

    btnLogout.addEventListener('click', async () => {
      await signOut(auth);
      showLoginPage();
    });

    async function loadMembers() {
      membersGrid.innerHTML = '<div class="empty-msg">⏳ Loading members...</div>';

      try {
        const q = query(collection(db, 'memberships'), orderBy('created_at', 'desc'));
        const snapshot = await getDocs(q);
        allMembers = [];
        snapshot.forEach((d) => {
          allMembers.push({ id: d.id, ...d.data() });
        });
        updateStats();
        renderMembers(allMembers);
      } catch (err) {
        console.error('Load error:', err);
        try {
          const snapshot = await getDocs(collection(db, 'memberships'));
          allMembers = [];
          snapshot.forEach((d) => {
            allMembers.push({ id: d.id, ...d.data() });
          });
          allMembers.sort((a, b) => {
            const ta = a.created_at?.seconds || 0;
            const tb = b.created_at?.seconds || 0;
            return tb - ta;
          });
          updateStats();
          renderMembers(allMembers);
        } catch (err2) {
          membersGrid.innerHTML = `<div class="empty-msg">❌ Error: ${escapeHtml(err2.message)}</div>`;
        }
      }
    }

    function updateStats() {
      document.getElementById('statTotal').textContent = allMembers.length;

      const today = new Date();
      const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime() / 1000;
      const todayCount = allMembers.filter(m => {
        const ts = m.created_at?.seconds || 0;
        return ts >= todayStart;
      }).length;
      document.getElementById('statToday').textContent = todayCount;

      const states = new Set(allMembers.map(m => m.state).filter(Boolean));
      document.getElementById('statStates').textContent = states.size;
    }

    function renderMembers(list) {
      if (!list.length) {
        membersGrid.innerHTML = '';
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';

      membersGrid.innerHTML = list.map(m => `
        <div class="member-item">
          <img src="${escapeHtml(m.photo_url || '')}" 
               alt="${escapeHtml(m.full_name)}" 
               onerror="this.src='https://via.placeholder.com/70x85?text=No+Photo'">
          <div class="member-info">
            <h3>${escapeHtml(m.full_name || 'N/A')}</h3>
            <span class="mem-num">${escapeHtml(m.membership_number || '')}</span>
            <div>📞 <strong>${escapeHtml(m.phone || 'N/A')}</strong></div>
            <div>📍 <strong>${escapeHtml(m.ward || '')}</strong>, ${escapeHtml(m.state || '')}</div>
            <div>📅 ${formatDate(m.created_at)}</div>
            <div class="member-actions">
              <button class="btn-view" data-id="${m.id}">👁️ View</button>
              <button class="btn-share" data-id="${m.id}">📤 Share</button>
              <button class="btn-del" data-id="${m.id}" data-name="${escapeHtml(m.full_name)}">🗑️ Delete</button>
            </div>
          </div>
        </div>
      `).join('');

      membersGrid.querySelectorAll('.btn-view').forEach(b =>
        b.addEventListener('click', () => viewMember(b.dataset.id))
      );
      membersGrid.querySelectorAll('.btn-share').forEach(b =>
        b.addEventListener('click', () => shareMember(b.dataset.id))
      );
      membersGrid.querySelectorAll('.btn-del').forEach(b =>
        b.addEventListener('click', () => deleteMember(b.dataset.id, b.dataset.name))
      );
    }

    function viewMember(id) {
      const m = allMembers.find(x => x.id === id);
      if (!m) return;

      modalContent.innerHTML = `
        <img src="${escapeHtml(m.photo_url || '')}" 
             alt="${escapeHtml(m.full_name)}" 
             onerror="this.style.display='none'">
        <h3>${escapeHtml(m.full_name)}</h3>
        <p>🆔 <strong>${escapeHtml(m.membership_number)}</strong></p>
        <p>📞 ${escapeHtml(m.phone)}</p>
        <p>📍 ${escapeHtml(m.ward)}, ${escapeHtml(m.state)}</p>
        <p>📅 Registered: ${formatDate(m.created_at)}</p>
        <p>✅ Status: ${escapeHtml(m.status || 'active')}</p>
        <button class="close-modal">Close</button>
      `;
      modalContent.querySelector('.close-modal').addEventListener('click', () => {
        viewModal.classList.remove('show');
      });
      viewModal.classList.add('show');
    }

    viewModal.addEventListener('click', (e) => {
      if (e.target === viewModal) viewModal.classList.remove('show');
    });

    async function shareMember(id) {
      const m = allMembers.find(x => x.id === id);
      if (!m) return;

      const text = `🪪 T/T Tinubu Tafidah Member\n\n👤 ${m.full_name}\n🆔 ${m.membership_number}\n📞 ${m.phone}\n📍 ${m.ward}, ${m.state}`;

      try {
        if (navigator.share) {
          await navigator.share({
            title: 'T/T Tinubu Tafidah Member',
            text: text,
            url: m.photo_url || undefined
          });
        } else {
          await navigator.clipboard.writeText(text);
          alert('✅ Member info copied!');
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          alert('⚠️ Could not share.');
        }
      }
    }

    async function deleteMember(id, name) {
      if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;

      try {
        await deleteDoc(doc(db, 'memberships', id));
        alert('✅ Member deleted.');
        await loadMembers();
      } catch (err) {
        alert('❌ Error: ' + err.message);
      }
    }

    function applyFilter() {
      const q = searchInput.value.trim().toLowerCase();
      const st = stateFilter.value;

      let filtered = allMembers;
      if (st) filtered = filtered.filter(m => m.state === st);
      if (q) {
        filtered = filtered.filter(m =>
          (m.full_name || '').toLowerCase().includes(q) ||
          (m.phone || '').includes(q) ||
          (m.membership_number || '').toLowerCase().includes(q) ||
          (m.ward || '').toLowerCase().includes(q)
        );
      }
      renderMembers(filtered);
    }

    searchInput.addEventListener('input', applyFilter);
    stateFilter.addEventListener('change', applyFilter);
    btnRefresh.addEventListener('click', loadMembers);

    // QR SCANNER
    const qrScannerModal = document.getElementById('qrScannerModal');
    const qrReader = document.getElementById('qr-reader');
    const qrResult = document.getElementById('qr-result');
    const btnScanQR = document.getElementById('btnScanQR');
    const closeQrScanner = document.getElementById('closeQrScanner');

    let html5QrCode = null;
    let isScanning = false;

    btnScanQR.addEventListener('click', () => {
      qrScannerModal.classList.add('show');
      qrResult.innerHTML = '<div style="color:#666;">📷 Point camera at QR code...</div>';
      startQrScanner();
    });

    closeQrScanner.addEventListener('click', () => {
      stopQrScanner();
      qrScannerModal.classList.remove('show');
    });

    qrScannerModal.addEventListener('click', (e) => {
      if (e.target === qrScannerModal) {
        stopQrScanner();
        qrScannerModal.classList.remove('show');
      }
    });

    function startQrScanner() {
      if (isScanning) return;
      if (typeof Html5Qrcode === 'undefined') {
        qrResult.innerHTML = '<div style="color:#b71c1c;">❌ QR library not loaded.</div>';
        return;
      }
      html5QrCode = new Html5Qrcode("qr-reader");
      isScanning = true;

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => handleQrScanned(decodedText),
        () => {}
      ).catch((err) => {
        console.error('QR error:', err);
        qrResult.innerHTML = '<div style="color:#b71c1c;">❌ Cannot access camera.</div>';
        isScanning = false;
      });
    }

    function stopQrScanner() {
      if (html5QrCode && isScanning) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          html5QrCode = null;
          isScanning = false;
        }).catch(() => { isScanning = false; });
      }
    }

    async function handleQrScanned(decodedText) {
      stopQrScanner();

      qrResult.innerHTML = `<div style="color:#006B3F; font-weight:700;">✅ QR detected!</div>
        <div style="margin-top:8px; color:#666;">🔍 Searching...</div>`;

      const idMatch = decodedText.match(/ID:\s*([^\s|]+)/i);
      if (!idMatch) {
        qrResult.innerHTML = '<div style="color:#b71c1c;">❌ Invalid QR code.</div>';
        return;
      }

      const memberId = idMatch[1].trim();

      try {
        const snapshot = await getDocs(collection(db, 'memberships'));
        let found = null;
        snapshot.forEach((d) => {
          const data = d.data();
          if (data.membership_number === memberId) {
            found = { id: d.id, ...data };
          }
        });

        if (found) {
          showQrMemberFound(found);
        } else {
          qrResult.innerHTML = `<div style="color:#b71c1c; font-weight:700;">❌ No member: ${escapeHtml(memberId)}</div>
            <button class="close-modal" id="qrCloseBtn2" style="margin-top:10px;">Close</button>`;
          document.getElementById('qrCloseBtn2').addEventListener('click', () => {
            qrScannerModal.classList.remove('show');
          });
        }
      } catch (err) {
        qrResult.innerHTML = `<div style="color:#b71c1c;">❌ Error: ${escapeHtml(err.message)}</div>`;
      }
    }

    function showQrMemberFound(m) {
      qrResult.innerHTML = `
        <div style="background:#eaf5ea; padding:14px; border-radius:12px; border:2px solid #006B3F; text-align:left; margin-top:8px;">
          <div style="text-align:center; margin-bottom:10px;">
            <img src="${escapeHtml(m.photo_url || '')}" 
                 style="width:80px; height:95px; object-fit:cover; border-radius:8px; border:2px solid #006B3F;" 
                 onerror="this.style.display='none'">
            <div style="color:#006B3F; font-weight:900; font-size:1rem; margin-top:6px;">✅ VERIFIED MEMBER</div>
          </div>
          <div style="font-size:0.88rem; color:#0b1f0b;">
            <div style="margin-bottom:3px;">👤 <strong>${escapeHtml(m.full_name)}</strong></div>
            <div style="margin-bottom:3px;">🆔 <strong>${escapeHtml(m.membership_number)}</strong></div>
            <div style="margin-bottom:3px;">📞 ${escapeHtml(m.phone)}</div>
            <div style="margin-bottom:3px;">📍 ${escapeHtml(m.ward)}, ${escapeHtml(m.state)}</div>
            <div style="margin-bottom:3px;">📅 ${formatDate(m.created_at)}</div>
            <div>✅ Status: ${escapeHtml(m.status || 'active')}</div>
          </div>
        </div>
        <button class="close-modal" id="qrCloseBtn" style="margin-top:10px;">Close</button>
      `;
      document.getElementById('qrCloseBtn').addEventListener('click', () => {
        qrScannerModal.classList.remove('show');
      });
    }

    onAuthStateChanged(auth, (user) => {
      if (user) showDashboard();
      else showLoginPage();
    });

  </script>
</body>
</html>
